<section class="login">
  <h1 class="login__title">Sign in to FTMS</h1>

  <form class="form" [formGroup]="form" (ngSubmit)="signIn()" novalidate>
    @if (failure(); as message) {
      <!-- role="alert" so a screen reader announces the failure rather than leaving the user
           wondering why nothing happened when they pressed the button. -->
      <p class="login__error" role="alert">{{ message }}</p>
    }

    <label class="field">
      <span class="field__label">User name</span>
      <input
        z-input
        type="text"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        formControlName="userName"
      />
    </label>

    <label class="field">
      <span class="field__label">Password</span>
      <input z-input type="password" autocomplete="current-password" formControlName="password" />
    </label>

    <div class="form__actions">
      <button z-button type="submit" [disabled]="busy()">
        {{ busy() ? 'Signing in…' : 'Sign in' }}
      </button>
    </div>
  </form>
</section>
